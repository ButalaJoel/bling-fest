# Render Blueprint: one web service (website + API on the same address) and one Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: bling-fest
    runtime: node
    plan: starter            # paid: always on (free instances sleep) and allows pre-deploy migrations
    region: frankfurt        # closest Render region to Uganda
    buildCommand: npm ci --include=dev && npm run build && cd server && npm ci --include=dev && npm run build
    preDeployCommand: cd server && npm run migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bling-fest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: bling-fest-db
    plan: basic-256mb
    region: frankfurt
    databaseName: blingfest
    ipAllowList: []          # no access from the internet: only the Render web service can connect
